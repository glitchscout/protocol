name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  compat:
    # Within a protocol version, schema changes must keep accepting every golden fixture on the base branch.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: git worktree add "$RUNNER_TEMP/base" "origin/${{ github.base_ref }}"
      - run: go run ./cmd/compatcheck -base "$RUNNER_TEMP/base" -head .

  ksy:
    # The Kaitai Struct definition of the binary frame must compile.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KSC_VERSION: "0.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install kaitai-struct-compiler
        run: |
          curl -sSfL -o "$RUNNER_TEMP/ksc.deb" "https://github.com/kaitai-io/kaitai_struct_compiler/releases/download/${KSC_VERSION}/kaitai-struct-compiler_${KSC_VERSION}_all.deb"
          sudo apt-get install -y "$RUNNER_TEMP/ksc.deb"
      - run: kaitai-struct-compiler -t python --outdir "$RUNNER_TEMP/ksc" binary-frame-v1.ksy
